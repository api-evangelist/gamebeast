aid: gamebeast
name: Gamebeast
description: >-
  Gamebeast is an AI-first intelligence platform for game studios that unifies
  analytics, A/B testing, LiveOps, remote configuration, player sentiment analysis,
  and marketing attribution across Roblox, Unity, Unreal, and custom engines. Studios
  instrument their game once with a single SDK and use engagement markers, experiments,
  cohorts, funnels, retention, heatmaps, and a Query Builder to understand player
  behavior and ship data-driven updates, with an autonomous AI assistant on top.
